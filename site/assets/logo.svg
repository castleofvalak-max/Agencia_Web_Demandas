<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente Adaptável Base (será refinado após o Passo 3 de Engenharia Reversa) -->
    <linearGradient id="converticaC_Grad" x1="14" y1="58" x2="52" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>

    <!-- Filtro de Resplendor / Glow Sutil -->
    <filter id="converticaC_Glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Monograma Arquitetônico 'C' com Cortes Facetados em 45º -->
  <path d="M50 18L32 6L14 17V47L32 58L50 47L42 42L32 48L22 42V22L32 16L42 22L50 18Z" 
        fill="url(#converticaC_Grad)" 
        filter="url(#converticaC_Glow)"/>

  <!-- Núcleo de Convergência / Ponto de Luz em Escala -->
  <circle cx="32" cy="32" r="4.5" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="32" cy="32" r="2" fill="#00F2FE"/>
</svg>
