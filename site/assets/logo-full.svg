<svg width="360" height="64" viewBox="0 0 380 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente Base do Monograma (pronto para receber tokens do Passo 3) -->
    <linearGradient id="full_C_Grad" x1="10" y1="56" x2="50" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>

    <!-- Gradiente de Realce no É -->
    <linearGradient id="full_Text_Grad" x1="140" y1="36" x2="220" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Filtro de Glow Sutil -->
    <filter id="full_C_Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- === ISOTIPO: MONOGRAMA 'C' (VÉRTICE) === -->
  <g transform="translate(6, 2)">
    <path d="M46 18L30 8L14 18V46L30 56L46 46L38 41L30 46L22 41V23L30 18L38 23L46 18Z" 
          fill="url(#full_C_Grad)" 
          filter="url(#full_C_Glow)"/>
    <circle cx="30" cy="32" r="4" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="30" cy="32" r="1.8" fill="#00F2FE"/>
  </g>

  <!-- === WORDMARK OFICIAL: CONVÉRTICA === -->
  <text x="74" y="37" font-family="'Syne', 'Inter', system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="2.5" fill="#FFFFFF">CONV<tspan fill="url(#full_Text_Grad)">É</tspan>RTICA</text>

  <!-- Tagline / Assinatura de Posicionamento -->
  <text x="75" y="51" font-family="'Space Mono', 'Inter', monospace" font-size="8" font-weight="600" letter-spacing="3" fill="#8F9CAE">WEB &amp; DEMAND ENGINE</text>
</svg>
