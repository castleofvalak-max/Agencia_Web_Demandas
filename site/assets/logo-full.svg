<svg width="280" height="64" viewBox="0 0 280 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente do Isotipo -->
    <linearGradient id="fullGrad" x1="8" y1="56" x2="56" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="45%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>

    <!-- Gradiente do Acento no Texto -->
    <linearGradient id="textGrad" x1="160" y1="36" x2="260" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Filtro de Glow -->
    <filter id="fullGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- === ISOTIPO VETORIAL === -->
  <g transform="translate(4, 2)">
    <!-- Faceta Inferior -->
    <path d="M10 44L22 14L32 24L18 50L10 44Z" fill="url(#fullGrad)" opacity="0.9"/>
    <!-- Faceta Superior Ascendente -->
    <path d="M24 32L38 8L48 14L36 44L24 32Z" fill="url(#fullGrad)" filter="url(#fullGlow)"/>
    <!-- Convergência Central -->
    <polygon points="32,24 43,24 38,36 26,36" fill="#FFFFFF" opacity="0.9"/>
    <!-- Ponto de Vértice -->
    <circle cx="38" cy="8" r="2.2" fill="#00F2FE"/>
  </g>

  <!-- === TIPOGRAFIA / WORDMARK === -->
  <!-- Nome Principal: CONVÉRTICA -->
  <text x="68" y="36" font-family="'Syne', 'Inter', system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="2.5" fill="#FFFFFF">CONV<tspan fill="url(#textGrad)">É</tspan>RTICA</text>

  <!-- Tagline / Assinatura Técnica -->
  <text x="69" y="50" font-family="'Space Mono', 'Inter', monospace" font-size="7.5" font-weight="600" letter-spacing="3.2" fill="#8F9CAE">WEB &amp; DEMAND ENGINE</text>
</svg>
